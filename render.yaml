# Render 一键部署（Blueprint）：https://render.com/docs/blueprint-spec
# 免费实例在无人访问 15 分钟后会休眠，下次打开需要约 30~60 秒唤醒。
services:
  - type: web
    name: defuse-fps
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
