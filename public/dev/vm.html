<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型预览（开发用）</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242b; overflow: hidden; font: 13px/1.5 system-ui, sans-serif; color: #dfe5ee; }
  canvas { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(0, 0, 0, .45); padding: 6px 10px; border-radius: 6px; }
  #ui a { color: #ffd76a; margin-right: 8px; cursor: pointer; }
</style>
<script>
  // three.js 来源：和游戏主页一样，优先用本服务器托管的，找不到再用 CDN
  (function () {
    var local = '/lib/three/three.module.js', cdn = 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js', ok = false;
    try { var x = new XMLHttpRequest(); x.open('HEAD', local, false); x.send(); ok = x.status === 200; } catch (e) {}
    var s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = JSON.stringify({ imports: { three: ok ? local : cdn } });
    document.currentScript.after(s);
  })();
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">模型预览 · 网址参数：w=武器 skin=刀的皮肤 team=T/CT view=fp（第一人称）/orbit（转着看） yaw pitch dist
  <div><a data-a="fire">开火</a><a data-a="reload">换弹</a><a data-a="inspect">检视</a><a data-a="draw">拔枪</a><a data-a="slash">挥刀</a><a data-a="stab">捅</a><a data-a="pin">拔拉环</a></div></div>
<script type="module">
// 开发用的模型预览页：/dev/vm.html?w=ak47&team=CT&view=fp
import * as THREE from 'three';
import { ViewModel, RECOIL } from '../js/client/viewmodel.js';
import { makeWeapon } from '../js/client/models.js';
import { WEAPONS } from '../js/shared/weapons.js';
import { HAND_POSES, HAND_SHAPES } from '../js/client/hdmodels.js';
import { KNIFE_POSES } from '../js/client/vmanims.js';

const q = new URLSearchParams(location.search);
const wid = q.get('w') || 'ak47', team = q.get('team') || 'CT';
const S = { view: q.get('view') || 'fp', yaw: +(q.get('yaw') || 0.9), pitch: +(q.get('pitch') || 0.25), dist: +(q.get('dist') || 0.9), far: q.get('far') === '1' };
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));

// 背景：一片天空和地面（和游戏里差不多的亮度）
const bg = new THREE.Scene();
bg.background = new THREE.Color(0x9fb4cf);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: 0xc2a577 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.6;
bg.add(ground);
const wall = new THREE.Mesh(new THREE.BoxGeometry(30, 6, 1), new THREE.MeshBasicMaterial({ color: 0xa08b68 }));
wall.position.set(0, 1.2, -18);
bg.add(wall);
const bgCam = new THREE.PerspectiveCamera(74, 1, 0.1, 500);

const vm = new ViewModel();
vm.team = team;
vm.knifeSkin = q.get('skin') || 'default';
vm.setWeapon(wid, 0, 0);
const now = () => performance.now() / 1000;

// 转着看：把枪（和手）单独拿出来看
const orbitCam = new THREE.PerspectiveCamera(40, 1, 0.01, 20);
// 放大画面的一块来看细节：S.zoom = [左, 上, 宽, 高]（都是 0~1 的比例）
function zoomTo(cam, w, h) {
  if (S.zoom) cam.setViewOffset(w, h, S.zoom[0] * w, S.zoom[1] * h, S.zoom[2] * w, S.zoom[3] * h);
  else cam.clearViewOffset();
  cam.updateProjectionMatrix();
}
function render() {
  const w = S.w || canvas.clientWidth || 1280, h = S.h || canvas.clientHeight || 720;
  // S.green：绿幕背景（和参考视频对比、量轮廓用）
  bg.background.set(S.green ? 0x00ff00 : 0x9fb4cf);
  ground.visible = wall.visible = !S.green;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) renderer.setSize(w, h, false);
  renderer.autoClear = false;
  renderer.clear();
  bgCam.aspect = w / h; bgCam.updateProjectionMatrix();
  renderer.render(bg, bgCam);
  renderer.clearDepth();
  vm.prepare(renderer);
  if (S.view === 'orbit') {
    const g = vm.cur;
    // 以握把和护木中间为中心转
    g.position.set(0, 0, 0); g.rotation.set(0, 0, 0);
    g.updateMatrixWorld(true);
    const cc = S.center || [0, 0.02, -0.2];
    const c = new THREE.Vector3(cc[0], cc[1], cc[2]).applyMatrix4(g.matrixWorld);
    orbitCam.aspect = w / h; orbitCam.updateProjectionMatrix();
    orbitCam.position.set(c.x + Math.sin(S.yaw) * Math.cos(S.pitch) * S.dist, c.y + Math.sin(S.pitch) * S.dist, c.z + Math.cos(S.yaw) * Math.cos(S.pitch) * S.dist);
    orbitCam.lookAt(c);
    zoomTo(orbitCam, w, h);
    renderer.render(vm.scene, orbitCam);
  } else {
    vm.resize(w / h);
    zoomTo(vm.camera, w, h);
    renderer.render(vm.scene, vm.camera);
  }
}
let last = now();
function tick() {
  const t = now(), dt = Math.min(0.05, t - last);
  last = t;
  if (S.view !== 'orbit') vm.update(dt, { now: t, speed: 0, onGround: true, crouch: false, mdx: 0, mdy: 0, scoped: false, hidden: false, silenced: false });
  render();
}
function loop() { if (!S.pause) tick(); requestAnimationFrame(loop); }
loop();
// 调试用：直接画出 t 时刻的画面（st 可以带 speed、mdx 这些状态）
function at(t, st) {
  vm.update((st && st.dt) || 0.016, { now: t, speed: 0, onGround: true, crouch: false, mdx: 0, mdy: 0, scoped: false, hidden: false, silenced: false, ...st });
  render();
}
// 调试用：把一串画面拼成一张图。frames = [[标题, 准备这一帧的函数]…]，crop = [左, 上, 右, 下]（0~1）
function sheet(frames, cols = 4, crop = [0, 0, 1, 1]) {
  let c = document.getElementById('sheet');
  if (!c) { c = document.createElement('canvas'); c.id = 'sheet'; c.style.cssText = 'position:fixed;left:0;top:0;z-index:9;height:auto;width:' + (S.sheetW || 1000) + 'px'; document.body.appendChild(c); }
  if (!frames) { c.remove(); return; }
  const tw = Math.floor(1280 / cols);
  let g = null, th = 0;
  frames.forEach(([label, fn], i) => {
    fn();
    const sw = canvas.width * (crop[2] - crop[0]), sh = canvas.height * (crop[3] - crop[1]);
    if (!g) { th = Math.round((tw * sh) / sw); c.width = tw * cols; c.height = th * Math.ceil(frames.length / cols); g = c.getContext('2d'); }
    const x = (i % cols) * tw, y = Math.floor(i / cols) * th;
    g.drawImage(canvas, canvas.width * crop[0], canvas.height * crop[1], sw, sh, x, y, tw, th);
    g.fillStyle = '#ff0'; g.font = 'bold 15px sans-serif'; g.fillText(label, x + 5, y + 17);
  });
}

// 调试用（要先开 S.green）：量武器和手的轮廓 —— 最左、最上在画面的什么位置（0~1），占画面多大
function box() {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(canvas, 0, 0);
  const W = c.width, H = c.height, d = g.getImageData(0, 0, W, H).data;
  const col = new Uint32Array(W), row = new Uint32Array(H);
  let n = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (!(d[i + 1] > 200 && d[i] < 90 && d[i + 2] < 90)) { n++; col[x]++; row[y]++; }
  }
  let left = 0, top = 0;
  while (left < W && col[left] < 4) left++;
  while (top < H && row[top] < 4) top++;
  return { left: +(left / W).toFixed(3), top: +(top / H).toFixed(3), area: +(n / (W * H)).toFixed(4) };
}

// 调试用：拿刀的右手，手腕和手肘现在在画面的什么位置（-1~1，右、上为正；z > 0 是在镜头后面）。
// 小臂应该一直是从右下方伸上来的：手肘在手腕的右边 / 下边
function armAt() {
  const g = vm.cur, pose = HAND_POSES['knife_' + vm.knifeSkin] || HAND_POSES.knife;
  g.updateMatrixWorld(true);
  const pt = (a) => {
    const v = new THREE.Vector3(a[0], a[1], a[2]).applyMatrix4(g.matrixWorld).applyMatrix4(vm.camera.matrixWorldInverse);
    const k = Math.tan((vm.camera.fov * Math.PI) / 360);
    return [+(v.x / -v.z / k / vm.camera.aspect).toFixed(2), +(v.y / -v.z / k).toFixed(2), +v.z.toFixed(2)];
  };
  return { grip: pt(pose.right.grip), elbow: pt(pose.right.elbow) };
}

const acts = {
  fire: () => vm.onFire(now(), 1),
  reload: () => vm.onReload(now(), (WEAPONS[wid] && WEAPONS[wid].reload) || 2.5),
  inspect: () => vm.onInspect(now()),
  draw: () => { vm.wid = null; vm.setWeapon(wid, (WEAPONS[wid] && WEAPONS[wid].deploy) || 0.5, now()); },
  slash: () => vm.onKnife(now(), false),
  stab: () => vm.onKnife(now(), true),
  pin: () => vm.onPin(now()),
};
document.getElementById('ui').addEventListener('click', (e) => { const a = e.target.dataset && e.target.dataset.a; if (a && acts[a]) acts[a](); });
// 给调试脚本用
// 调姿势：改 __POSES 里的数，再调 __rebuild() 重新搭一遍手
function rebuild() { for (const g of vm.cache.values()) vm.root.remove(g); vm.cache.clear(); const w = vm.wid; vm.wid = null; vm.cur = null; vm.setWeapon(w, 0, 0); }
Object.assign(window, { __vm: vm, __S: S, __tick: tick, __at: at, __sheet: sheet, __acts: acts, __THREE: THREE, __makeWeapon: makeWeapon, __renderer: renderer, __POSES: HAND_POSES, __rebuild: rebuild, __box: box, __RECOIL: RECOIL, __KP: KNIFE_POSES, __SH: HAND_SHAPES, __armAt: armAt });
</script>
</body>
</html>
